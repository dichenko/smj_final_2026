services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgres://tri_ruchki:${DB_PASSWORD}@db:5432/tri_ruchki
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_SECRET=${ADMIN_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=tri_ruchki
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=tri_ruchki
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tri_ruchki"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
