name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload project files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          TARGET_PATH="${VPS_PATH:-/opt/smj_final_2026}"

          ssh -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$TARGET_PATH'"
          rsync -az --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude 'pgdata/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            ./ "$VPS_USER@$VPS_HOST:$TARGET_PATH/"

      - name: Restart containers
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          APP_PORT: ${{ secrets.APP_PORT }}
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          TARGET_PATH="${VPS_PATH:-/opt/smj_final_2026}"
          PUBLIC_APP_PORT="${APP_PORT:-3000}"
          ENV_FILE="$(mktemp)"

          {
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'ADMIN_SECRET=%s\n' "$ADMIN_SECRET"
            printf 'APP_PORT=%s\n' "$PUBLIC_APP_PORT"
          } > "$ENV_FILE"

          scp -i ~/.ssh/deploy_key -P "$PORT" "$ENV_FILE" "$VPS_USER@$VPS_HOST:$TARGET_PATH/.env"
          rm -f "$ENV_FILE"

          ssh -i ~/.ssh/deploy_key -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$TARGET_PATH' && docker compose up -d --build"
