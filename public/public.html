<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3 ручки — ответы</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="public-page">
  <main class="public-layout">
    <aside class="illustration-placeholder" aria-label="Место для иллюстрации">
      <div class="placeholder-mark">Иллюстрация</div>
    </aside>

    <section class="responses-panel" aria-label="Ответы участников">
      <article class="response-section response-success" data-section="green">
        <header>
          <h2>Успех</h2>
          <button type="button" class="toggle-section" data-section="green">Показать</button>
        </header>
        <div class="response-list" id="list-green" aria-live="polite"></div>
      </article>

      <article class="response-section response-lapse" data-section="blue">
        <header>
          <h2>Ляп</h2>
          <button type="button" class="toggle-section" data-section="blue">Показать</button>
        </header>
        <div class="response-list" id="list-blue" aria-live="polite"></div>
      </article>

      <article class="response-section response-insight" data-section="red">
        <header>
          <h2>Инсайт</h2>
          <button type="button" class="toggle-section" data-section="red">Показать</button>
        </header>
        <div class="response-list" id="list-red" aria-live="polite"></div>
      </article>
    </section>
  </main>

  <div class="counts-indicator" id="counts-indicator">0/0/0</div>

  <script src="/js/public.js"></script>
</body>
</html>
