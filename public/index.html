<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Коктейль</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container form-container">
    <h1>Коктейль</h1>
    <p class="subtitle">Заполните один, два или три ответа</p>

    <form id="answers-form" class="answer-form">
      <label class="single-field single-field-success">
        <span>Успех</span>
        <textarea name="success" data-field="success" placeholder="Что получилось хорошо?"></textarea>
      </label>

      <label class="single-field single-field-lapse">
        <span>Ляп</span>
        <textarea name="lapse" data-field="lapse" placeholder="Что пошло не так или вышло неловко?"></textarea>
      </label>

      <label class="single-field single-field-insight">
        <span>Инсайт</span>
        <textarea name="insight" data-field="insight" placeholder="Какой вывод или мысль хочется забрать?"></textarea>
      </label>

      <button type="submit" class="btn-submit">Отправить</button>
    </form>

    <section class="thanks-panel" id="thanks-panel" hidden>
      <img src="/img/bokal.png" alt="" class="thanks-image">
      <h2>Спасибо!</h2>
    </section>
  </main>

  <button class="reload-btn" id="reload-btn" aria-label="Заполнить заново">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </svg>
  </button>

  <script src="/js/form.js"></script>
</body>
</html>
